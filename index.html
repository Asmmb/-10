<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراجعة التفاعلية الشاملة (3 ساعات) - الرياضيات</title>
    <!-- تحميل Tailwind CSS للتصميم المتجاوب -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- تحميل خط Cairo و Tajawal للغة العربية و Inter للأرقام والمعادلات -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        .math-ltr {
            font-family: 'Inter', monospace;
            direction: ltr;
            display: inline-block;
            unicode-bidi: isolate;
        }
        /* تأثيرات حركية سلسة */
        .fade-in {
            animation: fadeIn 0.35s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* تخصيص شريط التمرير */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800">

    <!-- الشريط العلوي: العنوان ومؤقت الـ 3 ساعات -->
    <header class="bg-gradient-to-l from-indigo-900 via-indigo-800 to-blue-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <!-- العنوان -->
                <div class="flex items-center gap-3 text-center md:text-right">
                    <div class="bg-white/15 p-2.5 rounded-xl backdrop-blur-sm border border-white/20">
                        <svg class="w-7 h-7 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">المراجعة التفاعلية المكثفة (3 ساعات)</h1>
                        <p class="text-indigo-200 text-xs sm:text-sm">الوحدة 1: الدوال التربيعية | الوحدة 2: الدوال الكسرية والجذرية</p>
                    </div>
                </div>

                <!-- مؤقت الجلسة ونسبة الإنجاز -->
                <div class="flex flex-wrap items-center justify-center gap-3 bg-indigo-950/60 px-4 py-2 rounded-2xl border border-indigo-500/30">
                    <div class="flex items-center gap-2">
                        <span class="relative flex h-3 w-3">
                            <span id="timer-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75 hidden"></span>
                            <span id="timer-dot" class="relative inline-flex rounded-full h-3 w-3 bg-amber-400"></span>
                        </span>
                        <span class="text-xs text-indigo-200">الوقت المتبقي:</span>
                        <span id="timer-display" class="math-ltr font-bold text-lg sm:text-xl text-amber-300 tracking-wider">03:00:00</span>
                    </div>
                    <div class="flex items-center gap-1.5 border-r border-indigo-700 pr-3">
                        <button id="timer-toggle-btn" onclick="toggleTimer()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition shadow-sm">
                            ابدأ المؤقت
                        </button>
                        <button onclick="resetTimer()" title="إعادة ضبط 3 ساعات" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold p-1.5 rounded-lg transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- شريط التقدم العام -->
            <div class="mt-4">
                <div class="flex justify-between text-xs text-indigo-200 mb-1">
                    <span>نسبة إتقان المراجعة التفاعلية</span>
                    <span id="progress-text" class="font-bold text-white">0% (0 / 12 سؤال)</span>
                </div>
                <div class="w-full bg-indigo-950/80 rounded-full h-2.5 overflow-hidden border border-indigo-700/50">
                    <div id="progress-bar" class="bg-gradient-to-l from-emerald-400 to-teal-300 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- أزرار التنقل بين مراحل خطة الـ 3 ساعات -->
        <nav aria-label="مراحل المراجعة" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5 mb-6">
            <button onclick="switchTab('plan')" id="tab-plan" class="tab-btn active-tab flex flex-col items-center justify-center p-3 rounded-xl border-2 border-indigo-600 bg-indigo-600 text-white shadow-md transition">
                <span class="text-xs opacity-85">الجدول الزمني</span>
                <span class="font-bold text-sm mt-0.5">خطة الـ 3 ساعات</span>
            </button>
            <button onclick="switchTab('u1d1')" id="tab-u1d1" class="tab-btn flex flex-col items-center justify-center p-3 rounded-xl border-2 border-slate-200 bg-white text-slate-700 hover:border-indigo-300 transition">
                <span class="text-xs text-indigo-600 font-semibold">الوحدة 1 • 35 د</span>
                <span class="font-bold text-sm mt-0.5">الدوال التربيعية</span>
            </button>
            <button onclick="switchTab('u1d6')" id="tab-u1d6" class="tab-btn flex flex-col items-center justify-center p-3 rounded-xl border-2 border-slate-200 bg-white text-slate-700 hover:border-indigo-300 transition">
                <span class="text-xs text-indigo-600 font-semibold">الوحدة 1 • 40 د</span>
                <span class="font-bold text-sm mt-0.5">التحويلات والمتباينات</span>
            </button>
            <button onclick="switchTab('u2d2')" id="tab-u2d2" class="tab-btn flex flex-col items-center justify-center p-3 rounded-xl border-2 border-slate-200 bg-white text-slate-700 hover:border-teal-300 transition">
                <span class="text-xs text-teal-600 font-semibold">الوحدة 2 • 30 د</span>
                <span class="font-bold text-sm mt-0.5">المعادلات الكسرية</span>
            </button>
            <button onclick="switchTab('u2d45')" id="tab-u2d45" class="tab-btn flex flex-col items-center justify-center p-3 rounded-xl border-2 border-slate-200 bg-white text-slate-700 hover:border-teal-300 transition">
                <span class="text-xs text-teal-600 font-semibold">الوحدة 2 • 45 د</span>
                <span class="font-bold text-sm mt-0.5">الدوال الجذرية (4 و 5)</span>
            </button>
            <button onclick="switchTab('quiz')" id="tab-quiz" class="tab-btn flex flex-col items-center justify-center p-3 rounded-xl border-2 border-amber-300 bg-amber-50 text-amber-900 hover:bg-amber-100 transition">
                <span class="text-xs text-amber-700 font-semibold">التقييم • 60 د (40 نقطة)</span>
                <span class="font-bold text-sm mt-0.5">الاختبار الشامل</span>

        </nav>

        <!-- حاوية العرض الديناميكي للأقسام -->
        <div id="content-area" class="fade-in"></div>

    </main>

    <!-- تذييل الصفحة -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs sm:text-sm text-slate-500">
            منصة المراجعة التفاعلية للرياضيات • صُممت لمساعدتك على تنظيم وقتك وإتقان المفاهيم خطوة بخطوة
        </div>
    </footer>

    <!-- صندوق رسائل مخصص بديل عن alert -->
    <div id="toast-box" class="fixed bottom-5 left-5 z-50 hidden transform transition-all duration-300">
        <div class="bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 border border-slate-700">
            <span id="toast-icon" class="text-lg">💡</span>
            <p id="toast-msg" class="text-sm font-medium"></p>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. إدارة حالة التطبيق وبيانات المراجعة
        // ==========================================
        let totalSeconds = 3 * 60 * 60; // 3 ساعات بالثواني
        let timerInterval = null;
        let isTimerRunning = false;
        let currentTab = 'plan';
        const solvedQuestions = new Set(); // لتتبع الأسئلة المحلولة بنجاح في الدروس

        // حالة الاختبار النهائي (20 سؤالاً × 2 نقطة = 40 نقطة)
        let examUserAnswers = {};
        let examSubmitted = false;
        let examShuffledQuestions = [];

        // قاعدة بيانات أسئلة الاختبار النهائي (60 دقيقة - 40 نقطة)
        const fullExamQuestions = [
            // القسم الأول: الاختيار من متعدد (12 سؤالاً)
            {
                id: "ex_1", section: "mcq", unit: "الوحدة الأولى: الدوال والمعادلات التربيعية",
                skill: "خصائص الدوال التربيعية ورأس القطع المكافئ",
                text: "السؤال 1 – إيجاد القيمة الصغرى: لدينا الدالة <span class='math-ltr font-bold bg-slate-100 px-2 py-0.5 rounded'>f(x) = 2(x + 1)² - 7</span>، ما القيمة الصغرى للدالة؟",
                options: [
                    { text: "<span class='math-ltr'>-1</span>", correct: false },
                    { text: "<span class='math-ltr'>-7</span>", correct: true },
                    { text: "<span class='math-ltr'>2</span>", correct: false },
                    { text: "<span class='math-ltr'>7</span>", correct: false }
                ],
                explanation: "الدالة مكتوبة بصيغة الرأس <span class='math-ltr'>f(x) = a(x - h)² + k</span> حيث الرأس <span class='math-ltr'>(-1, -7)</span> و <span class='math-ltr'>a = 2 > 0</span>، لذا القيمة الصغرى هي <span class='math-ltr'>k = -7</span>."
            },
            {
                id: "ex_2", section: "mcq", unit: "الوحدة الأولى: الدوال والمعادلات التربيعية",
                skill: "حل المعادلات التربيعية والجذور",
                text: "السؤال 2 – حل معادلة تربيعية: أي القيم الآتية تمثل حلول المعادلة <span class='math-ltr font-bold bg-slate-100 px-2 py-0.5 rounded'>x² - 5x + 6 = 0</span>؟",
                options: [
                    { text: "<span class='math-ltr'>x = 1, x = 6</span>", correct: false },
                    { text: "<span class='math-ltr'>x = -2, x = -3</span>", correct: false },
                    { text: "<span class='math-ltr'>x = 2, x = 3</span>", correct: true },
                    { text: "<span class='math-ltr'>x = -1, x = 6</span>", correct: false }
                ],
                explanation: "بالتحليل إلى عوامل: <span class='math-ltr'>(x - 2)(x - 3) = 0</span>، ومنه <span class='math-ltr'>x = 2</span> أو <span class='math-ltr'>x = 3</span>."
            },
            {
                id: "ex_3", section: "mcq", unit: "الوحدة الأولى: الدوال والمعادلات التربيعية",
                skill: "حل المعادلات التربيعية والجذور",
                text: "السؤال 3 – الربط بين الجذور والمعادلة: إذا كان جذرا معادلة تربيعية هما <span class='math-ltr font-bold'>x = -2</span> و <span class='math-ltr font-bold'>x = 5</span>، فأي المعادلات الآتية تمثلها؟",
                options: [
                    { text: "<span class='math-ltr'>(x - 2)(x + 5) = 0</span>", correct: false },
                    { text: "<span class='math-ltr'>(x + 2)(x - 5) = 0</span>", correct: true },
                    { text: "<span class='math-ltr'>(x + 2)(x + 5) = 0</span>", correct: false },
                    { text: "<span class='math-ltr'>(x - 2)(x - 5) = 0</span>", correct: false }
                ],
                explanation: "لكل جذر <span class='math-ltr'>r</span> يكون العامل <span class='math-ltr'>(x - r)</span>؛ إذن العوامل هي <span class='math-ltr'>(x - (-2))(x - 5) = (x + 2)(x - 5) = 0</span>."
            },
            {
                id: "ex_4", section: "mcq", unit: "الوحدة الأولى: الدوال والمعادلات التربيعية",
                skill: "خصائص الدوال التربيعية ورأس القطع المكافئ",
                text: "السؤال 4 – تحليل خصائص الدالة: لدينا الدالة <span class='math-ltr font-bold bg-slate-100 px-2 py-0.5 rounded'>f(x) = x² - 4x + 1</span>، ما إحداثيات رأس القطع المكافئ؟",
                options: [
                    { text: "<span class='math-ltr'>(2, -3)</span>", correct: true },
                    { text: "<span class='math-ltr'>(-2, -3)</span>", correct: false },
                    { text: "<span class='math-ltr'>(2, 3)</span>", correct: false },
                    { text: "<span class='math-ltr'>(-2, 1)</span>", correct: false }
                ],
                explanation: "الإحداثي السيني <span class='math-ltr'>x = -b/(2a) = 4/2 = 2</span>، وبالتعويض: <span class='math-ltr'>f(2) = 2² - 4(2) + 1 = 4 - 8 + 1 = -3</span>. الرأس <span class='math-ltr'>(2, -3)</span>."
            },
            {
                id: "ex_5", section: "mcq", unit: "الوحدة الأولى: الدوال والمعادلات التربيعية",
                skill: "التحويلات وتفسير النماذج التربيعية",
                text: "السؤال 5 – تطبيقات الدالة التربيعية: يمثل ارتفاع كرة بعد قذفها النموذج <span class='math-ltr font-bold bg-slate-100 px-2 py-0.5 rounded'>h(t) = -4t² + 16t + 2</span>، ما أقصى ارتفاع تصل إليه الكرة؟",
                options: [
                    { text: "16 مترًا", correct: false },
                    { text: "18 مترًا", correct: true },
                    { text: "20 مترًا", correct: false },
                    { text: "22 مترًا", correct: false }
                ],
                explanation: "زمن أقصى ارتفاع <span class='math-ltr'>t = -16 / (2 × -4) = 2</span> ثانية. أقصى ارتفاع <span class='math-ltr'>h(2) = -4(4) + 16(2) + 2 = -16 + 32 + 2 = 18</span> مترًا."
            },
            {
                id: "ex_6", section: "mcq", unit: "الوحدة الأولى: الدوال والمعادلات التربيعية",
                skill: "التحويلات وتفسير النماذج التربيعية",
                text: "السؤال 6 – مقارنة التمثيلات البيانية: أي الدوال الآتية يمثل منحناها قطعًا مكافئًا مفتوحًا للأسفل وأكثر ضيقًا من منحنى <span class='math-ltr font-bold'>f(x) = x²</span>؟",
                options: [
                    { text: "<span class='math-ltr'>g(x) = (1/2)x²</span>", correct: false },
                    { text: "<span class='math-ltr'>g(x) = -x²</span>", correct: false },
                    { text: "<span class='math-ltr'>g(x) = -3x²</span>", correct: true },
                    { text: "<span class='math-ltr'>g(x) = 3x²</span>", correct: false }
                ],
                explanation: "مفتوح للأسفل يعني <span class='math-ltr'>a < 0</span>، وأكثر ضيقًا (توسع رأسي) يعني <span class='math-ltr'>|a| > 1</span>، وهذا يتحقق في <span class='math-ltr'>g(x) = -3x²</span>."
            },
            {
                id: "ex_7", section: "mcq", unit: "الوحدة الثانية: الدوال الكسرية والجذرية",
                skill: "الدوال والمعادلات الكسرية",
                text: "السؤال 7 – تحديد المجال: ما مجال الدالة <span class='math-ltr font-bold bg-slate-100 px-2 py-0.5 rounded'>f(x) = 7 / (x² - 25)</span>؟",
                options: [
                    { text: "جميع الأعداد الحقيقية ما عدا <span class='math-ltr'>5</span>", correct: false },
                    { text: "جميع الأعداد الحقيقية ما عدا <span class='math-ltr'>-5</span>", correct: false },
                    { text: "جميع الأعداد الحقيقية ما عدا <span class='math-ltr'>5</span> و <span class='math-ltr'>-5</span>", correct: true },
                    { text: "جميع الأعداد الحقيقية", correct: false }
                ],
                explanation: "نستثني أصفار المقام: <span class='math-ltr'>x² - 25 = 0 ⇒ x² = 25 ⇒ x = ±5</span>."
            },
            {
                id: "ex_8", section: "mcq", unit: "الوحدة الثانية: الدوال الكسرية والجذرية",
                skill: "الدوال والمعادلات الكسرية",
                text: "السؤال 8 – التعويض في الدالة الكسرية: إذا كانت <span class='math-ltr font-bold bg-slate-100 px-2 py-0.5 rounded'>f(x) = (2x + 1) / (x - 3)</span>، فما قيمة <span class='math-ltr font-bold'>f(1)</span>؟",
                options: [
                    { text: "<span class='math-ltr'>-3/2</span>", correct: true },
                    { text: "<span class='math-ltr'>3/2</span>", correct: false },
                    { text: "<span class='math-ltr'>-2</span>", correct: false },
                    { text: "<span class='math-ltr'>2</span>", correct: false }

                explanation: "بالتعويض عن <span class='math-ltr'>x = 1</span>: <span class='math-ltr'>f(1) = (2(1) + 1) / (1 - 3) = 3 / (-2) = -3/2</span>."
            },
            {
                id: "ex_9", section: "mcq", unit: "الوحدة الثانية: الدوال الكسرية والجذرية",

                options: [
                    { text: "<span class='math-ltr'>x = 0</span>", correct: false },
                    { text: "<span class='math-ltr'>x = 1</span>", correct: true },
                    { text: "<span class='math-ltr'>x = 2</span>", correct: false },
                    { text: "<span class='math-ltr'>x = -1</span>", correct: false }
                ],
                explanation: "بالضرب التبادلي: <span class='math-ltr'>2(x + 1) = 4 ⇒ x + 1 = 2 ⇒ x = 1</span> (وهو لا يساوي القيمة المستثناة <span class='math-ltr'>-1</span>)."
            },
            {
                id: "ex_10", section: "mcq", unit: "الوحدة الثانية: الدوال الكسرية والجذرية",
                skill: "الدوال الجذرية ومجالها وتحويلاتها",
                text: "السؤال 10 – تحديد مجال الدالة الجذرية: ما مجال الدالة <span class='math-ltr font-bold bg-slate-100 px-2 py-0.5 rounded'>f(x) = √(3x - 12)</span>؟",

                    { text: "<span class='math-ltr'>x ≥ 4</span>", correct: true },

                text: "السؤال 11 – حل معادلة جذرية: ما حل المعادلة <span class='math-ltr font-bold bg-slate-100 px-2 py-0.5 rounded'>√(x + 5) = 4</span>؟",

        // ==========================================

        function initExam(shuffle = false) {

            // نسخ الأسئلة وتطبيق الخلط العشوائي إذا طُلب (مع إبقاء خيارات صح/خطأ مرتبة)
            examShuffledQuestions = fullExamQuestions.map(q => {
                const clonedOptions = q.options.map((opt, idx) => ({ ...opt, origIdx: idx }));
                if (shuffle && q.section === 'mcq') {
                    for (let i = clonedOptions.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [clonedOptions[i], clonedOptions[j]] = [clonedOptions[j], clonedOptions[i]];
                    }
                }
                return { ...q, displayOptions: clonedOptions };
            });

            if (shuffle) {
                const mcqPart = examShuffledQuestions.filter(q => q.section === 'mcq');
                const tfPart = examShuffledQuestions.filter(q => q.section === 'tf');
                for (let i = mcqPart.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [mcqPart[i], mcqPart[j]] = [mcqPart[j], mcqPart[i]];
                }
                for (let i = tfPart.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [tfPart[i], tfPart[j]] = [tfPart[j], tfPart[i]];
                }
                examShuffledQuestions = [...mcqPart, ...tfPart];
                showToast("تم تفعيل الترتيب العشوائي للأسئلة والخيارات!", "🔀");
            }
        }

            if (answeredCount < examShuffledQuestions.length) {
                const remaining = examShuffledQuestions.length - answeredCount;
                showToast(`تبقى لديك ${remaining} سؤال لم تجب عنه! أكمل جميع الأسئلة أو اضغط تسليم مرة أخرى للتأكيد.`, "⚠️");
                // السماح بالتسليم في النقرة الثانية إذا أراد الطالب
                if (!window._confirmSubmitOnce) {
                    window._confirmSubmitOnce = true;
                    setTimeout(() => { window._confirmSubmitOnce = false; }, 5000);
                    return;
                }
            }
            window._confirmSubmitOnce = false;
            examSubmitted = true;
            renderExamView(document.getElementById('content-area'));
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast("تم تسليم الاختبار واحتساب الدرجة من 40!", "🎓");

                                    </tr>
                                </thead>

                                    <tr><td class="p-2">خصائص الدوال التربيعية ورأس القطع المكافئ</td><td class="p-2">1، 4، 13، 14</td><td class="p-2 font-bold">8</td></tr>

                                    <tr><td class="p-2">التحويلات وتفسير النماذج التربيعية</td><td class="p-2">5، 6</td><td class="p-2 font-bold">4</td></tr>
                                    <tr><td class="p-2">الدوال والمعادلات الكسرية</td><td class="p-2">7، 8، 9، 17</td><td class="p-2 font-bold">8</td></tr>

        // ==========================================
        // 3. دوال المؤقت الزمني (3 ساعات)
        // ==========================================
        function formatTime(secs) {
            const hrs = Math.floor(secs / 3600);
            const mins = Math.floor((secs % 3600) / 60);
            const s = secs % 60;
            return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function toggleTimer() {
            const btn = document.getElementById('timer-toggle-btn');
            const ping = document.getElementById('timer-ping');
            const dot = document.getElementById('timer-dot');

            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                btn.textContent = "استئناف";
                btn.classList.replace('bg-amber-600', 'bg-emerald-600');
                btn.classList.replace('hover:bg-amber-500', 'hover:bg-emerald-500');
                ping.classList.add('hidden');
                dot.classList.replace('bg-emerald-400', 'bg-amber-400');
            } else {
                isTimerRunning = true;
                btn.textContent = "إيقاف مؤقت";
                btn.classList.replace('bg-emerald-600', 'bg-amber-600');
                btn.classList.replace('hover:bg-emerald-500', 'hover:bg-amber-500');
                ping.classList.remove('hidden');
                dot.classList.replace('bg-amber-400', 'bg-emerald-400');

                timerInterval = setInterval(() => {
                    if (totalSeconds > 0) {
                        totalSeconds--;
                        document.getElementById('timer-display').textContent = formatTime(totalSeconds);
                    } else {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        showToast("انتهت مدة الـ 3 ساعات المخصصة للمراجعة! أحسنت العمل.", "🎉");
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            totalSeconds = 3 * 60 * 60;
            document.getElementById('timer-display').textContent = formatTime(totalSeconds);
            const btn = document.getElementById('timer-toggle-btn');
            btn.textContent = "ابدأ المؤقت";
            btn.className = "bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition shadow-sm";
            document.getElementById('timer-ping').classList.add('hidden');
            document.getElementById('timer-dot').classList.replace('bg-emerald-400', 'bg-amber-400');
            showToast("تمت إعادة ضبط مؤقت الـ 3 ساعات.", "⏱️");
        }

        // ==========================================
        // 3. نظام الإشعارات وتحديث التقدم
        // ==========================================
        function showToast(message, icon = "💡") {
            const box = document.getElementById('toast-box');
            document.getElementById('toast-msg').textContent = message;
            document.getElementById('toast-icon').textContent = icon;
            box.classList.remove('hidden');
            setTimeout(() => {
                box.classList.add('hidden');
            }, 3500);
        }

        function updateProgress() {
            const totalQuestions = 10;
            const count = solvedQuestions.size;
            const percent = Math.round((count / totalQuestions) * 100);
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('progress-text').textContent = `${percent}% (${count} / ${totalQuestions} تدريبات الدروس)`;
        }

        // ==========================================
        // 4. عرض المحتوى والتنقل بين التبويبات
        // ==========================================
        function switchTab(tabId) {
            currentTab = tabId;
            
            // تحديث مظهر أزرار التنقل
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-indigo-600', 'bg-indigo-600', 'text-white', 'shadow-md', 'ring-2', 'ring-offset-1', 'ring-indigo-400');
                if (btn.id === 'tab-quiz') {
                    btn.className = "tab-btn flex flex-col items-center justify-center p-3 rounded-xl border-2 border-amber-300 bg-amber-50 text-amber-900 hover:bg-amber-100 transition";
                } else {
                    btn.className = "tab-btn flex flex-col items-center justify-center p-3 rounded-xl border-2 border-slate-200 bg-white text-slate-700 hover:border-indigo-300 transition";
                }
            });

            const activeBtn = document.getElementById(`tab-${tabId}`);
            if (tabId === 'quiz') {
                activeBtn.className = "tab-btn flex flex-col items-center justify-center p-3 rounded-xl border-2 border-amber-500 bg-amber-500 text-white shadow-md transition";
            } else {
                activeBtn.className = "tab-btn flex flex-col items-center justify-center p-3 rounded-xl border-2 border-indigo-600 bg-indigo-600 text-white shadow-md transition";
            }

            const container = document.getElementById('content-area');
            container.classList.remove('fade-in');
            void container.offsetWidth; // إعادة تشغيل الأنيميشن
            container.classList.add('fade-in');

            if (tabId === 'plan') {
                renderPlanView(container);
            } else if (tabId === 'quiz') {
                renderExamView(container);
            } else {
                renderLessonView(container, sectionsData[tabId]);
            }
        }

                                <span class="text-indigo-700 font-bold text-sm">الوحدة ١</span>
                            </div>
                            <h3 class="font-extrabold text-lg text-slate-900 mb-2">الدوال والمعادلات التربيعية</h3>
                            <ul class="space-y-2 text-sm text-slate-700 mb-4">
                                <li class="flex items-start gap-2">

                                </li>

                                </li>
                            </ul>
                            <div class="flex gap-2">
                                <button onclick="switchTab('u1d1')" class="text-xs font-bold bg-white border border-indigo-200 text-indigo-700 px-3 py-1.5 rounded-lg hover:bg-indigo-600 hover:text-white transition">الدرس 1</button>
                                <button onclick="switchTab('u1d6')" class="text-xs font-bold bg-white border border-indigo-200 text-indigo-700 px-3 py-1.5 rounded-lg hover:bg-indigo-600 hover:text-white transition">الدرس 6</button>
                            </div>

                        <!-- استراحة -->
                        <div class="border border-emerald-200 bg-emerald-50/50 rounded-2xl p-5 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-center mb-3">

                                    <span class="text-2xl">☕</span>
                                </div>
                                <h3 class="font-extrabold text-lg text-slate-900 mb-2">تجديد التركيز وتثبيت الذاكرة</h3>
                                <p class="text-sm text-slate-600 leading-relaxed">
                                    بعد إتمام 75 دقيقة من التركيز في الدوال التربيعية، ابتعد عن الشاشة لمدة 15 دقيقة، اشرب الماء، وتحرك قليلاً لتهيئة عقلك للوحدة الثانية.
                                </p>
                            </div>
                            <div class="mt-4 text-xs font-semibold text-emerald-700 bg-emerald-100/70 px-3 py-2 rounded-lg">

        // عرض محتوى الدرس (الملخص + الأسئلة التفاعلية)
        function renderLessonView(container, data) {
            const badgeColors = {
                indigo: "bg-indigo-100 text-indigo-800",
                teal: "bg-teal-100 text-teal-800",
                amber: "bg-amber-100 text-amber-800"
            };

            let summaryHTML = '';
            if (data.summary && data.summary.length > 0) {
                summaryHTML = `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
                        <h3 class="text-base sm:text-lg font-extrabold text-slate-900 mb-4 flex items-center gap-2">
                            <span class="text-xl">📘</span>
                            <span>ملخص القوانين والمفاهيم الأساسية</span>
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${data.summary.map(card => `
                                <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-4">
                                    <h4 class="font-bold text-slate-800 text-sm mb-2.5 border-b border-slate-200 pb-1.5">${card.heading}</h4>
                                    <ul class="space-y-2 text-xs sm:text-sm text-slate-700 leading-relaxed">
                                        ${card.points.map(p => `<li class="flex items-start gap-2"><span class="text-indigo-500 font-bold">▪</span><span>${p}</span></li>`).join('')}
                                    </ul>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            const questionsHTML = data.questions.map((q, idx) => {
                const isSolved = solvedQuestions.has(q.id);
                return `
                    <div id="card-${q.id}" class="bg-white rounded-2xl shadow-sm border-2 ${isSolved ? 'border-emerald-400' : 'border-slate-200'} p-5 sm:p-6 transition">
                        <div class="flex flex-wrap justify-between items-center gap-2 mb-3">
                            <span class="text-xs font-bold px-3 py-1 rounded-full ${isSolved ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-700'}">
                                ${isSolved ? '✓ تم الحل بنجاح' : `تدريب تفاعلي ${idx + 1}`}
                            </span>
                            <button onclick="toggleHint('${q.id}')" class="text-xs font-bold text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200 px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                                <span>💡</span>
                                <span>عرض تلميح</span>
                            </button>
                        </div>

                        <p class="text-base sm:text-lg font-bold text-slate-900 mb-4 leading-relaxed">${q.text}</p>

                        <!-- صندوق التلميح -->
                        <div id="hint-${q.id}" class="hidden bg-amber-50/80 border-r-4 border-amber-400 p-3.5 rounded-lg mb-4 text-xs sm:text-sm text-amber-900">
                            <strong>تلميح للحل:</strong> ${q.hint}
                        </div>

                        <!-- الخيارات -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                            ${q.options.map((opt, optIdx) => `
                                <button onclick="checkAnswer('${q.id}', ${optIdx}, ${opt.correct})" 
                                    id="btn-${q.id}-${optIdx}"
                                    class="opt-btn-${q.id} text-right p-3.5 rounded-xl border-2 border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/40 font-semibold text-sm sm:text-base text-slate-800 transition flex items-center justify-between">
                                    <span>${opt.text}</span>
                                    <span class="status-icon text-lg"></span>
                                </button>
                            `).join('')}
                        </div>

                        <!-- صندوق التغذية الراجعة والشرح -->
                        <div id="feedback-${q.id}" class="${isSolved ? '' : 'hidden'} bg-emerald-50 border border-emerald-200 rounded-xl p-4 text-xs sm:text-sm text-emerald-950">
                            <div class="font-extrabold text-emerald-800 mb-1 flex items-center gap-1.5">
                                <span>✅</span>
                                <span>خطوات الحل والتفسير:</span>
                            </div>
                            <p class="leading-relaxed">${q.explanation}</p>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <!-- ترويسة الدرس -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-2">

                        <span class="text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-1 rounded-full">⏱️ المدة المقترحة: ${data.duration}</span>
                    </div>

                </div>

                ${summaryHTML}

                <div class="space-y-5">
                    <h3 class="text-base sm:text-lg font-extrabold text-slate-900 flex items-center gap-2 px-1">
                        <span class="text-xl">✍️</span>
                        <span>الأسئلة التفاعلية (اختر الإجابة الصحيحة للتحقق الفوري)</span>
                    </h3>
                    ${questionsHTML}
                </div>
            `;
        }

        // إظهار أو إخفاء التلميح
        function toggleHint(qId) {
            const hintEl = document.getElementById(`hint-${qId}`);
            hintEl.classList.toggle('hidden');
        }

        // التحقق من إجابة الطالب
        function checkAnswer(qId, selectedIdx, isCorrect) {
            const buttons = document.querySelectorAll(`.opt-btn-${qId}`);
            const selectedBtn = document.getElementById(`btn-${qId}-${selectedIdx}`);
            const feedbackEl = document.getElementById(`feedback-${qId}`);
            const cardEl = document.getElementById(`card-${qId}`);

            // إعادة تعيين ألوان الأزرار قبل التلوين الجديد
            buttons.forEach(btn => {
                btn.classList.remove('border-rose-500', 'bg-rose-50', 'text-rose-900', 'border-emerald-500', 'bg-emerald-50', 'text-emerald-900');
                btn.querySelector('.status-icon').textContent = '';
            });

            if (isCorrect) {
                selectedBtn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900');
                selectedBtn.querySelector('.status-icon').textContent = '✔️';
                feedbackEl.classList.remove('hidden');
                cardEl.classList.replace('border-slate-200', 'border-emerald-400');

                if (!solvedQuestions.has(qId)) {
                    solvedQuestions.add(qId);
                    updateProgress();
                    showToast("إجابة صحيحة! أحسنت، تم تحديث نسبة إنجازك.", "🌟");
                }
            } else {
                selectedBtn.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-900');
                selectedBtn.querySelector('.status-icon').textContent = '❌';
                showToast("إجابة غير صحيحة، حاول مرة أخرى أو استعن بزر التلميح!", "🤔");
            }
        }

        // التهيئة عند تحميل الصفحة
        window.onload = function() {
            switchTab('plan');
            updateProgress();
        };
    </script>
